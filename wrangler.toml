name = "jd-golf-hub-backend"
main = "src/index.js"
compatibility_date = "2026-07-01"

# 티타임 워치(핵심 MVP) - 30분마다 활성 워치를 백그라운드에서 재검색(src/watches.js
# refreshAllWatches, index.js scheduled 핸들러). 무료 플랜에서도 cron trigger는 지원됨.
[triggers]
crons = ["*/30 * * * *"]

# 1. KV 네임스페이스 바인딩 (스코어 기록, 동반자, 즐겨찾기 골프장, 정산 기록, 설정 등
#    실시간성이 중요한 가벼운 데이터 전부. 무거운 원본 사진/백업은 NAS(추후 Cloudflare Tunnel)로 분리)
# 생성: wrangler kv namespace create GOLF_KV
[[kv_namespaces]]
binding = "GOLF_KV"
id = "257448db92fb4aecbb76d1e722430dd8"

# 1-1. 골프장 가격 히스토리(D1, SQL) - 집에 있는 NAS(Synology DS-214, Docker 미지원)가 매일 새벽 1시에
#    골팡을 수집해서 POST /api/price-dashboard/ingest 로 밀어넣는다(NAS는 Cron 트리거의 서브리퀘스트
#    한도 없이 자유롭게 돌 수 있어서 KV 대신 여기로 분리 - nas-collector/README.md 참고).
#    시계열 집계(요일별/리드타임별 평균 등)가 많아 KV보다 SQL이 맞는 데이터라 D1을 새로 씀.
# 생성: wrangler d1 create jd-golf-price-db / 마이그레이션: wrangler d1 execute PRICE_DB --remote --file=migrations/0001_price_snapshots.sql
[[d1_databases]]
binding = "PRICE_DB"
database_name = "jd-golf-price-db"
database_id = "33b79d83-47d6-458d-b7ec-cae376e25e1e"

# 2. 기상청 단기예보/중기예보 조회서비스 API 키 (공공데이터포털, data.go.kr)
#    "기상청_단기예보 조회서비스"(15084084, "(구)_동네예보" 아님!) + 중기예보 3종 활용신청 후
#    발급되는 서비스키(Decoding 값) 사용 - README "기상청 단기예보 API 키 발급 및 등록" 참고
# 설정: wrangler secret put KMA_API_KEY
# vars에 평문으로 넣지 말 것 (반드시 secret)

# 3. 카카오맵(로컬) REST API 키 - 골프장 즐겨찾기 자동완성, 맛집 검색, 길찾기 딥링크용
#    Kakao Developers(developers.kakao.com) 로그인 → 내 애플리케이션 → 애플리케이션 추가
#    → 앱 요약정보에서 "REST API 키" 확인 → 2024.12부터 [카카오맵] 사용 설정 별도 ON 필요
# 설정: wrangler secret put KAKAO_API_KEY

# 4. (MVP4) 골프장 예약 조회용 - 로그인 세션 불필요 내부 API 연동 시 여기에 별도 secret 추가 예정

# 5. Anthropic API 키 - 스코어카드/화면캡처/영수증 이미지 인식(Claude Vision, 구조화 출력)
#    console.anthropic.com에서 발급. 보안상 클라이언트가 아닌 이 Worker에서만 호출한다.
# 설정: wrangler secret put ANTHROPIC_API_KEY

# 6. 가격 대시보드 ingest 인증 시크릿 - NAS 수집 스크립트(nas-collector/)가 POST
#    /api/price-dashboard/ingest 호출 시 X-Ingest-Secret 헤더로 보내는 값과 일치해야 함.
#    이 앱의 다른 API는 전부 무인증(개인용 단일 사용자 전제)이지만, ingest는 유일하게 대량 쓰기가
#    가능한 경로라 별도로 막아둔다. NAS의 config.json에도 같은 값을 넣어야 한다.
# 설정: wrangler secret put PRICE_INGEST_SECRET (임의의 랜덤 문자열)
